services:
  web:
    image: prattb/swe40006-fastapi:1.0
    build: .
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: redis          # the service name — resolved by Docker DNS
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [appnet]

  redis:
    image: redis:7-alpine
    # no "ports:" — Redis is deliberately unreachable from outside
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet:

volumes:
  redis-data:
